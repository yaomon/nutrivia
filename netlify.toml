# Netlify config. No [build] section on purpose — the publish directory is
# already set correctly in the Netlify UI and this repo has no build step,
# so there's nothing here that could break the deploy.
#
# The caching rules below mirror the service worker's two strategies: images
# are effectively immutable and cached hard, while scripts/styles/HTML must
# revalidate because they are NOT content-hashed — a stale copy would mean
# players running old code against a new save format.

# --- default: revalidate, plus baseline security headers ---
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# --- food sprites: ~200 files that never change once drawn ---
[[headers]]
  for = "/images/food/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- logos/icons: stable, but a rebrand should reach players within a week ---
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# --- code: not fingerprinted, so always check freshness (304s are cheap) ---
[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- the service worker itself must never be cached: a stale one would pin
#     players to an old build forever ---
[[headers]]
  for = "/service_worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
