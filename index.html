<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=0.9, shrink-to-fit=yes"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <link rel="icon" href="images/logo32.png" type="image/x-icon" />
        <link rel="stylesheet" href="styles/style.css" />
        <link rel="stylesheet" href="styles/bottom_container.css" />
        <link rel="stylesheet" href="styles/question.css" />
        <link rel="stylesheet" href="styles/stats.css" />
        <link rel="stylesheet" href="styles/choices.css" />
        <link rel="stylesheet" href="styles/firework.css" />
        <link rel="stylesheet" href="styles/reward.css" />
        <title>Nutrivia</title>
        <script src="index.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="scripts/domain1.js"></script>
        <script src="scripts/foods.js"></script>
        <script src="scripts/script.js"></script>
        <link rel="manifest" href="manifest.json" />
    </head>

    <body>
        <div class="reward">
            <div class="reward-label">You got</div>
            <div class="reward-pic">
                <div class="rare-bg">
                    <div class="tasty-bg"></div>
                    <div class="savory-bg"><div class="savory-star"></div></div>
                    <div class="delicious-bg">
                        <div class="delicious-star-wrapper-1">
                            <div class="delicious-star-1"></div>
                        </div>
                        <div class="delicious-star-wrapper-2">
                            <div class="delicious-star-2"></div>
                        </div>
                        <div class="delicious-star-wrapper-3">
                            <div class="delicious-star-3"></div>
                        </div>
                    </div>
                    <div class="gourmet-bg">
                        <div class="delicious-star-wrapper-1">
                            <div class="delicious-star-1"></div>
                        </div>
                        <div class="delicious-star-wrapper-2">
                            <div class="delicious-star-2"></div>
                        </div>
                        <div class="delicious-star-wrapper-3">
                            <div class="delicious-star-3"></div>
                        </div>
                    </div>
                    <div class="decadent-bg"></div>
                    <div class="divine-bg"></div>
                </div>
                <img class="reward-pic-src" src="images/food/apple.png" />
            </div>
            <div class="reward-info">
                <div class="reward-name inset-text">Apple</div>
                <div class="reward-divider"></div>
                <div class="reward-rarity inset-text">Legendary</div>
                <div class="reward-desc">
                    Crunchy or soft, tacos are filled with flavorful ingredients
                    and always satisfying.
                </div>
            </div>
            <div class="reward-next button inset-text">Woo!</div>
        </div>
        <div class="top-container">
            <div class="bottom-left">
                <div class="inset-text" id="level">Lv 1</div>
                <div class="streak inset-text">
                    <div class="pulse">🔥 0</div>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="question-num inset-text">00</div>
            <div class="question-frac inset-text">00/00</div>
            <p class="question inset-text"></p>
            <div class="choices">
                <div class="choice" id="choice-1">
                    <div class="choice-let inset-text">a</div>
                    <div class="choice-val"></div>
                </div>
                <div class="choice" id="choice-2">
                    <div class="choice-let inset-text">b</div>
                    <div class="choice-val"></div>
                </div>
                <div class="choice" id="choice-3">
                    <div class="choice-let inset-text">c</div>
                    <div class="choice-val"></div>
                </div>
                <div class="choice" id="choice-4">
                    <div class="choice-let inset-text">d</div>
                    <div class="choice-val"></div>
                </div>
            </div>
            <div class="bottom-container">
                <div class="bottom-left">
                    <div class="button inset-text" id="items">🥦</div>
                    <div class="button inset-text" id="items">🍗</div>
                    <div class="button inset-text" id="items">🍦</div>
                    <div class="button inset-text" id="items">🍞</div>
                    <div class="button inset-text" id="items">🥛</div>
                </div>
                <div class="bottom-right">
                    <div class="button inset-text" id="skip">▶</div>
                </div>
            </div>
        </div>
    </body>
</html>
